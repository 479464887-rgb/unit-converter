<!DOCTYPE html>
<html lang="en">

<head>
<meta property="og:title" content="Unit Converter — DevKit">
<meta property="og:description" content="Free online Unit Converter tool — fast, simple, and no signup required.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://479464887-rgb.github.io/unit-converter/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://479464887-rgb.github.io/unit-converter/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠</text></svg>">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Unit Converter — DevKit Tools</title>
  <meta name="description" content="在线单位换算器 - Length/重量/温度/面积/体积/速度Convert">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #58a6ff
    }

    .logo span {
      color: #f0c040
    }

    header .badge {
      font-size: 10px;
      background: #daa520;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 32px 24px;
      flex: 1
    }

    .tool-wrapper {
      padding: 20px 0
    }

    footer {
      padding: 16px 24px;
      border-top: 1px solid #21262d;
      text-align: center;
      font-size: 12px;
      color: #484f58
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
      margin: 0 8px
    }

    .btn-primary:hover {
      background: #2ea043 !important
    }

    .btn:hover {
      background: #30363d !important
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #58a6ff !important
    }

    .btn {
      font-family: inherit
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">🛠 <span>Dev</span>Kit<span class="badge">BETA</span></div>
    <div style="font-size:11px;color:#8b949e">🔒 Processed locally · No data uploaded</div>
  </header>
  <main>
    <h1 style="font-size:24px;margin-bottom:4px">Unit Converter</h1>
    <p style="color:#8b949e;font-size:14px;margin-bottom:8px">在线单位换算器 - Length/重量/温度/面积/体积/速度Convert</p>
    <div class="tool-wrapper">
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><select id="uc-cat" onchange="changeCat()" style="padding:10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px">
          <option value="length">Length</option>
          <option value="weight">重量</option>
          <option value="temperature">温度</option>
          <option value="area">面积</option>
          <option value="volume">体积</option>
          <option value="speed">速度</option>
        </select></div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><input type="number" id="uc-input" value="1" style="width:150px;padding:14px;font-size:16px;border:1px solid #30363d;border-radius:8px;background:#0d1117;color:#f0c040;outline:none;font-family:mono"><select id="uc-from" style="padding:10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px"></select><span style="font-size:18px;color:#8b949e">→</span><select id="uc-to" style="padding:10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px"></select></div>
      <div id="uc-result" style="margin-top:16px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;text-align:center;font-family:mono;font-size:24px;font-weight:700;color:#3fb950;min-height:70px;display:flex;align-items:center;justify-content:center"></div>
    </div>
  </main>
  <footer><a href="https://github.com/479464887-rgb/unit-converter">GitHub</a><span>·</span><span>© 2026 DevKit</span></footer>
  <script>
    const cats = {
      length: {
        units: {
          m: 1,
          km: 1000,
          cm: 0.01,
          mm: 0.001,
          mi: 1609.344,
          yd: 0.9144,
          ft: 0.3048,
          in: 0.0254
        },
        base: 'm'
      },
      weight: {
        units: {
          kg: 1,
          g: 0.001,
          mg: 0.000001,
          lb: 0.453592,
          oz: 0.0283495,
          t: 1000
        },
        base: 'kg'
      },
      temperature: {
        special: !0,
        units: {
          C: 1,
          F: 1,
          K: 1
        }
      },
      area: {
        units: {
          m2: 1,
          km2: 1e6,
          ha: 10000,
          acre: 4046.86,
          ft2: 0.092903
        },
        base: 'm2'
      },
      volume: {
        units: {
          L: 1,
          mL: 0.001,
          m3: 1000,
          gal: 3.78541,
          qt: 0.946353,
          pt: 0.473176,
          floz: 0.0295735
        },
        base: 'L'
      },
      speed: {
        units: {
          m_s: 1,
          km_h: 0.277778,
          mph: 0.44704,
          knot: 0.514444
        },
        base: 'm_s'
      }
    };

    function buildUnits() {
      const cat = cats[document.getElementById('uc-cat').value];
      ['uc-from', 'uc-to'].forEach(id => {
        const sel = document.getElementById(id);
        sel.innerHTML = Object.keys(cat.units).map(u => `<option value="${u}">${u}</option>`).join('')
      });
      document.getElementById('uc-from').value = Object.keys(cat.units)[0];
      document.getElementById('uc-to').value = Object.keys(cat.units)[1] || Object.keys(cat.units)[0];
      convert()
    }

    function convert() {
      const v = parseFloat(document.getElementById('uc-input').value);
      const cat = cats[document.getElementById('uc-cat').value];
      const from = document.getElementById('uc-from').value;
      const to = document.getElementById('uc-to').value;
      let r;
      if (cat.special && from in cat.units && to in cat.units) {
        if (from === to) r = v;
        else if (from === 'C' && to === 'F') r = v * 9 / 5 + 32;
        else if (from === 'C' && to === 'K') r = v + 273.15;
        else if (from === 'F' && to === 'C') r = (v - 32) * 5 / 9;
        else if (from === 'F' && to === 'K') r = (v - 32) * 5 / 9 + 273.15;
        else if (from === 'K' && to === 'C') r = v - 273.15;
        else if (from === 'K' && to === 'F') r = (v - 273.15) * 9 / 5 + 32
      } else {
        r = v * cat.units[from] / cat.units[to]
      }
      document.getElementById('uc-result').textContent = `${v} ${from} = ${parseFloat(r.toPrecision(12))} ${to}`
    }

    function changeCat() {
      buildUnits()
    }
    buildUnits();
    document.getElementById('uc-input').addEventListener('input', convert);
    ['uc-from', 'uc-to'].forEach(id => document.getElementById(id).addEventListener('change', convert))
  </script>
</body>

</html>
